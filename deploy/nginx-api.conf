# api.impix.hu -> Node szerver (127.0.0.1:3000)
# A HTTPS-t a certbot adja hozzá és írja át ezt a fájlt (lásd DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name api.impix.hu;

    # Videófeltöltéshez (a szerver alapból legfeljebb 2 GB-ot fogad el; MAX_UPLOAD_MB-vel állítható)
    client_max_body_size 2100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A feltöltés ne pufferelődjön az nginx-ben, hanem menjen közvetlenül a Node-nak
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Videók streamelése: ne kerüljön ideiglenes fájlba az nginx-ben (a Range kérések így gyorsak maradnak)
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
}
